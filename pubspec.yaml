name: ai_cv_maker
description: A minimalistic AI-powered CV/resume builder for UK, USA, Canada, Australia, and India.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management (Flutter team)
  provider: ^6.1.2

  # Routing
  go_router: ^14.6.1

  # Google Fonts
  google_fonts: ^6.2.1

  # AI — Google Gemini
  google_generative_ai: ^0.4.6

  # Local storage / file system
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # PDF export
  pdf: ^3.11.1
  printing: ^5.13.4

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
