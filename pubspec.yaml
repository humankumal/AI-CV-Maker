name: ai_cv_maker
description: A minimalistic AI-powered CV/resume builder for UK, USA, Canada, Australia, and India.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management (Flutter team)
  provider: ^6.1.2

  # Routing
  go_router: ^14.6.1

  # Google Fonts
  google_fonts: ^6.2.1

  # AI — Google Gemini
  google_generative_ai: ^0.4.6

  # Local storage / file system
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # PDF export
  pdf: ^3.11.1
  printing: ^5.13.4

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# `dart run flutter_launcher_icons` regenerates platform-specific icons.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#1F2A44"
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#1F2A44"
    theme_color: "#1F2A44"

# `dart run flutter_native_splash:create` regenerates the splash screen.
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#0F1422"
  image: "assets/icon/splash_logo.png"
  image_dark: "assets/icon/splash_logo.png"
  android_12:
    color: "#FFFFFF"
    color_dark: "#0F1422"
    image: "assets/icon/splash_logo.png"
  fullscreen: false
