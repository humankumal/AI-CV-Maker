name: all_in_one_document_reader_2026
description: Open any document or file — PDF, Office, EPUB, images, and more.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Routing
  go_router: ^14.6.1

  # Google Fonts
  google_fonts: ^6.2.1

  # Local storage / file system
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3

  # File picking
  file_picker: ^8.1.7

  # Document viewers
  pdfx: ^2.8.1
  photo_view: ^0.14.0
  webview_flutter: ^4.7.0
  flutter_markdown: ^0.7.5
  epub_view: ^5.1.2

  # File type detection
  mime: ^2.0.0

  # Open files with native apps
  open_filex: ^4.5.1

  # In-app purchases (Pro plan)
  in_app_purchase: ^3.2.0

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#000000"
    theme_color: "#000000"

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#000000"
  image: "assets/icon/splash_logo.png"
  image_dark: "assets/icon/splash_logo.png"
  android_12:
    color: "#FFFFFF"
    color_dark: "#000000"
    image: "assets/icon/splash_logo.png"
  fullscreen: false
